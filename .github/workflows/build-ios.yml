name: Build iOS IPA

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-ios:
    name: Build iOS App & IPA
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build and Package IPA
        run: |
          set -e
          cd iosApp

          echo "=== Xcode Version ==="
          xcodebuild -version

          echo "=== Xcode Project Targets & Schemes ==="
          xcodebuild -list -project iosApp.xcodeproj

          mkdir -p build/Release-iphoneos

          echo "=== Building iOS App ==="
          xcodebuild build \
            -project iosApp.xcodeproj \
            -target iosApp \
            -configuration Release \
            -sdk iphoneos \
            -destination "generic/platform=iOS" \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            AD_HOC_CODE_SIGNING_ALLOWED=YES \
            CODE_SIGNING_INJECT_BASE_ENTITLEMENTS=NO \
            CONFIGURATION_BUILD_DIR="$(pwd)/build/Release-iphoneos"

          echo "=== Packaging IPA ==="
          mkdir -p build/Payload
          cp -R build/Release-iphoneos/iosApp.app build/Payload/
          cd build
          zip -qr Ledger-iOS.ipa Payload
          cd ..

          echo "=== IPA successfully created ==="
          ls -lh build/Ledger-iOS.ipa

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Ledger-iOS-IPA
          path: iosApp/build/Ledger-iOS.ipa
          retention-days: 14
